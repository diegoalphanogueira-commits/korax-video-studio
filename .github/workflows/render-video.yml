name: Render Korax Video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/render-video.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Render MP4
        run: npm run render

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: korax-ad-mp4
          path: out/korax-ad.mp4
          if-no-files-found: error
          retention-days: 14
