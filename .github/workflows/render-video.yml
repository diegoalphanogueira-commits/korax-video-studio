name: Render Korax Video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/render-video.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install
          python -m pip install --upgrade pip
          python -m pip install edge-tts

      - name: Render new motion video
        run: |
          mkdir -p out
          npx remotion render src/index.ts KoraxAd out/korax-process-ad.mp4 \
            --codec=h264 --crf=18

      - name: Generate Brazilian Portuguese narration
        run: |
          python -m edge_tts \
            --voice pt-BR-AntonioNeural \
            --rate=+18% \
            --pitch=-3Hz \
            --text "Já tentou usar uma inteligência artificial no WhatsApp e se arrependeu? Ela respondia de forma engessada, ignorava o seu processo comercial e, depois de algumas mensagens, se perdia do treinamento. O problema não é a inteligência artificial. É usar uma IA que não entende a sua operação. Conheça a Kórax. Ela segue o seu processo, mantém o contexto, qualifica, agenda e sabe quando chamar um humano. Kórax. IA no WhatsApp, sem perder o controle comercial." \
            --write-media out/korax-process-voice.mp3

          ffmpeg -y -i out/korax-process-voice.mp3 \
            -af "highpass=f=90,lowpass=f=9500,acompressor=threshold=0.09:ratio=3:attack=10:release=160,volume=1.28,adelay=180|180,apad,atrim=0:27.5,alimiter=limit=0.95" \
            out/korax-process-voice.wav

      - name: Assemble final video with narration only
        run: |
          ffmpeg -y \
            -i out/korax-process-ad.mp4 \
            -i out/korax-process-voice.wav \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy -c:a aac -b:a 256k \
            -t 27.5 -movflags +faststart \
            out/korax-process-final.mp4

          ffprobe -v error \
            -show_entries format=duration:stream=codec_type,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            out/korax-process-final.mp4

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: korax-processo-comercial-final
          path: |
            out/korax-process-final.mp4
            out/korax-process-voice.mp3
          if-no-files-found: error
          retention-days: 14
